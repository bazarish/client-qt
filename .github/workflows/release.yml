# Bazarish project (c) 2026
name: Release

on:
  # Every push walks the whole path while the packaging is being settled; only
  # the publishing below waits for a tag.
  push:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            deploy: x86_64
            image: debian:12
            recipe: packaging/appimage-build.sh
            package: out/*.AppImage
          # No AppImage here: Qt publishes no host tools for this architecture,
          # so Qt comes from a distribution new enough to build with - and that
          # one is newer than an AppImage's reach is worth.
          - arch: arm64
            runner: ubuntu-24.04-arm
            deploy: aarch64
            image: debian:trixie
            recipe: packaging/linux-tarball.sh
            package: out/*.tar.gz
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Take the deploy tools
        run: |
          mkdir -p tools out
          curl -fsSL -o "tools/linuxdeploy-${{ matrix.deploy }}.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.deploy }}.AppImage"
          curl -fsSL -o "tools/linuxdeploy-plugin-qt-${{ matrix.deploy }}.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.deploy }}.AppImage"
          chmod +x tools/*.AppImage
      - name: Build the package
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/host:ro" -v "$PWD/tools:/tools:ro" -v "$PWD/out:/out" \
            "${{ matrix.image }}" bash "/host/${{ matrix.recipe }}" 2>&1 | tee -a ci-package.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ matrix.package }}
          if-no-files-found: error
      - name: Say what broke
        if: failure()
        run: .github/ci/report.sh

  linux-static:
    name: Linux amd64 static
    runs-on: ubuntu-24.04
    # Qt and everything under it are built from source, which the first time takes
    # hours; each stage that finished is kept for the runs after it.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: |
            musl-out/prefix
            musl-out/qt
          key: musl-amd64-${{ hashFiles('packaging/musl/**') }}-${{ github.run_id }}
          restore-keys: musl-amd64-${{ hashFiles('packaging/musl/**') }}-
      - name: See what is already built
        id: deps
        run: |
          mkdir -p musl-out/prefix musl-out/qt out
          if [ -f musl-out/prefix/.qt-qtsvg ]; then
              echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the binary
        run: |
          set -o pipefail
          {
              docker build -q -t bazarish-musl -f packaging/musl/Containerfile packaging/musl
              # Writable: common lays its i2pd patch over the checkout when it configures.
              docker run --rm -v "$PWD:/host" -v "$PWD/musl-out:/out" bazarish-musl \
                  sh -c 'rm -f /out/prefix/.app && sh /host/packaging/musl/build.sh'
              file musl-out/build/bazarish-app | grep -q 'static' \
                  || { echo "::error::the binary is not statically linked"; exit 1; }
              cp musl-out/build/bazarish-app out/Bazarish-x86_64-static
          } 2>&1 | tee -a ci-package.log
      # Kept even when the run is cut short, so a cold build gets further each time.
      - if: always() && steps.deps.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            musl-out/prefix
            musl-out/qt
          key: musl-amd64-${{ hashFiles('packaging/musl/**') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-static
          path: out/Bazarish-x86_64-static
          if-no-files-found: error
      - name: Say what broke
        if: failure()
        run: .github/ci/report.sh

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            # UCRT64 rather than the deprecated MINGW64: the C runtime is the one
            # Windows ships, and it is what the arm64 environment uses too.
            msystem: UCRT64
            package: mingw-w64-ucrt-x86_64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            package: mingw-w64-clang-aarch64
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git zip
            ${{ matrix.package }}-toolchain
            ${{ matrix.package }}-cmake
            ${{ matrix.package }}-ninja
            ${{ matrix.package }}-openssl
            ${{ matrix.package }}-sqlcipher
            ${{ matrix.package }}-opus
            ${{ matrix.package }}-qrencode
            ${{ matrix.package }}-boost
            ${{ matrix.package }}-qt6-base
            ${{ matrix.package }}-qt6-declarative
            ${{ matrix.package }}-qt6-multimedia
            ${{ matrix.package }}-qt6-tools
            ${{ matrix.package }}-python
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: .github/ci/build.sh configure
      - name: Build
        run: .github/ci/build.sh build
      - name: Test
        run: .github/ci/build.sh test
      - name: The portable folder
        run: |
          set -o pipefail
          objdump -h "build/bazarish-app.exe" | grep -q '\.rsrc' \
            || { echo "::error::the binary carries no resources, so no icon"; exit 1; }
          {
              packaging/windows-portable.sh "Bazarish-${{ matrix.arch }}"
              zip -qr "Bazarish-windows-${{ matrix.arch }}.zip" "Bazarish-${{ matrix.arch }}"
          } 2>&1 | tee -a ci-portable.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: Bazarish-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Say what broke
        if: failure()
        run: .github/ci/report.sh

  macos:
    name: macOS arm64
    # Homebrew bottles nothing for Intel macOS, so an x86_64 job builds Qt and the
    # rest from source and never finishes: the Mac package is arm64 alone.
    runs-on: macos-15
    steps:
      - name: Install the dependencies
        run: |
          brew update --quiet
          # One formula per call, and the openssl kegs before what links them: a
          # list is installed concurrently, and sqlcipher built from source reads
          # a keg that another install of the same command is still unpacking.
          for formula in openssl@3 openssl@4 ninja qt sqlcipher opus qrencode boost; do
              brew install --quiet "$formula"
          done
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: .github/ci/build.sh configure
      - name: Build
        run: .github/ci/build.sh build
      - name: Test
        run: .github/ci/build.sh test
      - name: The bundle
        run: |
          set -o pipefail
          {
              packaging/macos-app.sh
              cp -R build/bazarish-app.app Bazarish.app
              hdiutil create -volname Bazarish -srcfolder Bazarish.app -ov -format UDZO \
                  Bazarish-macos-arm64.dmg
          } 2>&1 | tee -a ci-bundle.log
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: Bazarish-macos-arm64.dmg
          if-no-files-found: error
      - name: Say what broke
        if: failure()
        run: .github/ci/report.sh

  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: 6.8.3
      # NDK r26b, the one Qt 6.8 names, keeps std::format behind an experimental
      # switch; r27c has it, and its libc++ runs Qt's libraries unchanged.
      NDK_VERSION: 27.2.12479018
      ANDROID_BUILD_TOOLS: 34.0.0
      ANDROID_PLATFORM: android-34
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install the host tools, the NDK and Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ninja-build
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" > /dev/null
          pipx run --spec aqtinstall==3.3.0 aqt install-qt linux desktop "$QT_VERSION" \
            linux_gcc_64 -m qtshadertools qtmultimedia --outputdir "$HOME/Qt"
          pipx run --spec aqtinstall==3.3.0 aqt install-qt all_os android "$QT_VERSION" \
            android_arm64_v8a -m qtmultimedia qtshadertools --outputdir "$HOME/Qt"
      - uses: actions/cache@v4
        with:
          path: ~/android-out/prefix
          key: android-arm64-${{ env.NDK_VERSION }}-${{ hashFiles('packaging/android/deps.sh') }}
      # Signed with a key made for this run: the package installs for testing, and
      # the next build's key will not update it.
      - name: Build the package
        run: |
          set -o pipefail
          BAZARISH_ANDROID_KEY_PASS=$(openssl rand -hex 16)
          export BAZARISH_ANDROID_KEY_PASS
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -alias bazarish \
            -keyalg RSA -keysize 3072 -validity 365 -storepass "$BAZARISH_ANDROID_KEY_PASS" \
            -dname "CN=Bazarish test build" > /dev/null
          JAVA_HOME="$JAVA_HOME_17_X64" \
          ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" \
          QT_ANDROID_ROOT="$HOME/Qt/$QT_VERSION/android_arm64_v8a" \
          QT_HOST_ROOT="$HOME/Qt/$QT_VERSION/gcc_64" \
          BAZARISH_ANDROID_KEYSTORE="$RUNNER_TEMP/test.keystore" \
          BAZARISH_ANDROID_KEY_ALIAS=bazarish \
            packaging/android/build.sh "$HOME/android-out" 2>&1 | tee -a ci-package.log
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: ~/android-out/Bazarish-android-arm64.apk
          if-no-files-found: error
      - name: Say what broke
        if: failure()
        run: .github/ci/report.sh

  publish:
    name: Publish
    needs: [linux, linux-static, windows, macos, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Hand the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=()
          while IFS= read -r file; do packages+=("$file"); done < <(find packages -type f)
          printf '%s\n' "${packages[@]}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes "${packages[@]}"
