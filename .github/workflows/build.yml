# Bazarish project (c) 2026
name: Build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runners carry four cores, and a build is capped at them, not above.
  BAZARISH_JOBS: 4

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Trixie is the oldest release carrying both floors this build has: OpenSSL
    # 3.5 (Argon2id) and Qt 6.5. The runner is of the same architecture, so
    # nothing here is emulated.
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install the toolchain and the dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates pkg-config python3 \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            libssl-dev zlib1g-dev libsqlcipher-dev libopus-dev libqrencode-dev \
            libboost-dev libboost-program-options-dev libgl-dev libxkbcommon-dev
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: .github/ci/build.sh configure
      - name: Build
        run: .github/ci/build.sh build
      - name: Test
        run: .github/ci/build.sh test
      - name: Say what broke
        if: failure()
        run: .github/ci/report.sh

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            msystem: MINGW64
            package: mingw-w64-x86_64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            package: mingw-w64-clang-aarch64
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.package }}-toolchain
            ${{ matrix.package }}-cmake
            ${{ matrix.package }}-ninja
            ${{ matrix.package }}-openssl
            ${{ matrix.package }}-sqlcipher
            ${{ matrix.package }}-opus
            ${{ matrix.package }}-qrencode
            ${{ matrix.package }}-boost
            ${{ matrix.package }}-qt6-base
            ${{ matrix.package }}-qt6-declarative
            ${{ matrix.package }}-qt6-multimedia
            ${{ matrix.package }}-python
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: .github/ci/build.sh configure
      - name: Build
        run: .github/ci/build.sh build
      - name: Test
        run: .github/ci/build.sh test
      - name: Say what broke
        if: failure()
        run: .github/ci/report.sh

  macos:
    name: macOS arm64
    # Only the arm64 runners are to be had: an x86_64 job waits for a machine
    # that does not come.
    runs-on: macos-15
    steps:
      - name: Install the dependencies
        run: |
          brew update --quiet
          brew install --quiet ninja qt openssl@3 sqlcipher opus qrencode boost
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: .github/ci/build.sh configure
      - name: Build
        run: .github/ci/build.sh build
      - name: Test
        run: .github/ci/build.sh test
      - name: Say what broke
        if: failure()
        run: .github/ci/report.sh
